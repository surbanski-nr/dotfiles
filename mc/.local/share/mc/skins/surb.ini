[skin]
    description = Surb dark: charcoal, white, green, cyan and orange
    256colors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

# These xterm-256 colors approximate the Nvim2 surb palette.
[aliases]
    bg = gray3
    bgalt = gray4
    selection = gray7
    fg = rgb555
    muted = gray15
    green = rgb252
    cyan = rgb245
    orange = rgb531
    red = rgb511
    purple = rgb414

[core]
    _default_ = fg;bg
    selected = fg;selection
    marked = green;bg;bold
    markselect = green;selection;bold
    gauge = bg;green
    input = fg;bgalt
    inputunchanged = muted;bgalt
    inputmark = bg;cyan
    disabled = gray10;bg
    reverse = bg;fg
    commandlinemark = bg;green
    header = cyan;bg
    inputhistory =
    commandhistory =
    shadow = black;gray1

[dialog]
    _default_ = fg;bgalt
    dfocus = fg;selection
    dhotnormal = green;bgalt
    dhotfocus = orange;selection
    dtitle = cyan;bgalt

[error]
    _default_ = fg;red;bold
    errdfocus = fg;selection
    errdhotnormal = orange;red
    errdhotfocus = orange;selection
    errdtitle = fg;red;bold

[filehighlight]
    directory = cyan;
    executable = green;
    symlink = orange;
    hardlink =
    stalelink = red;
    device = purple;
    special = purple;
    core = red;
    temp = muted;
    archive = purple;
    doc = fg;
    source = cyan;
    media = green;
    graph = cyan;
    database = orange;

[menu]
    _default_ = fg;bgalt
    menusel = fg;selection
    menuhot = green;bgalt
    menuhotsel = orange;selection
    menuinactive = muted;bgalt

[popupmenu]
    _default_ = fg;bgalt
    menusel = fg;selection
    menutitle = cyan;bgalt

[buttonbar]
    hotkey = orange;bgalt
    button = fg;bgalt

[statusbar]
    _default_ = fg;bgalt

[help]
    _default_ = fg;bg
    helpitalic = orange;bg
    helpbold = green;bg;bold
    helplink = cyan;bg;underline
    helpslink = bg;cyan
    helptitle = orange;bg

[editor]
    _default_ = fg;bg
    editbold = green;bg;bold
    editmarked = fg;selection
    editwhitespace = muted;bg
    editlinestate = orange;bgalt
    bookmark = fg;red
    bookmarkfound = bg;green
    editrightmargin = muted;bgalt
    editframe = muted;
    editframeactive = fg;
    editframedrag = orange;

[viewer]
    _default_ = fg;bg
    viewbold = green;bg;bold
    viewunderline = cyan;bg;underline
    viewselected = fg;selection

[diffviewer]
    added = bg;green
    changedline = fg;selection
    changednew = orange;selection
    changed = cyan;bgalt
    removed = fg;red
    error = fg;red;bold

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ←
    history-next-item-char = →
    history-show-list-char = ↓
    filename-scroll-left-char = «
    filename-scroll-right-char = »

[widget-scrollbar]
    first-vert-char = ↑
    last-vert-char = ↓
    first-horiz-char = «
    last-horiz-char = »
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
