[skin]
    description = Stock Calm with restrained Neovim default accents
    256colors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

# Closest xterm-256 colors to Neovim's default dark palette.
[aliases]
    bg = default
    dark = gray3
    deep = gray0
    bgalt = gray4
    selection = rgb012
    fg = gray23
    strong = rgb555
    muted = gray7
    green = rgb353
    cyan = rgb255
    yellow = rgb542
    red = rgb533
    redbg = rgb100
    purple = rgb545

[core]
    _default_ = fg;bg
    selected = strong;selection
    marked = green;bg;bold
    markselect = green;selection;bold
    gauge = dark;green
    input = fg;bgalt
    inputunchanged = muted;bgalt
    inputmark = dark;cyan
    disabled = muted;bg
    reverse = dark;strong
    commandlinemark = dark;green
    header = strong;bgalt
    inputhistory =
    commandhistory =
    shadow = black;deep

[dialog]
    _default_ = fg;bgalt
    dfocus = strong;selection
    dhotnormal = green;bgalt
    dhotfocus = green;selection
    dtitle = cyan;bgalt

[error]
    _default_ = strong;redbg;bold
    errdfocus = strong;selection
    errdhotnormal = yellow;redbg
    errdhotfocus = yellow;selection
    errdtitle = strong;redbg;bold

[filehighlight]
    directory = cyan;
    executable = green;
    symlink = yellow;
    hardlink =
    stalelink = red;
    device = purple;
    special = purple;
    core = red;
    temp = muted;
    archive = purple;
    doc = fg;
    source = yellow;
    media = green;
    graph = cyan;
    database = yellow;

[menu]
    _default_ = fg;bgalt
    menusel = strong;selection
    menuhot = green;bgalt
    menuhotsel = green;selection
    menuinactive = fg;bgalt

[popupmenu]
    _default_ = fg;bgalt
    menusel = strong;selection
    menutitle = cyan;bgalt

[buttonbar]
    hotkey = strong;selection
    button = fg;bgalt

[statusbar]
    _default_ = fg;bgalt

[help]
    _default_ = fg;bg
    helpitalic = yellow;bg
    helpbold = green;bg;bold
    helplink = cyan;bg;underline
    helpslink = dark;cyan
    helptitle = cyan;bg

[editor]
    _default_ = fg;bg
    editbold = green;bg;bold
    editmarked = strong;selection
    editwhitespace = muted;bg
    editlinestate = yellow;bgalt
    bookmark = strong;redbg
    bookmarkfound = dark;green
    editrightmargin = muted;bgalt
    editframe = muted;
    editframeactive = fg;
    editframedrag = yellow;

[viewer]
    _default_ = fg;bg
    viewbold = green;bg;bold
    viewunderline = cyan;bg;underline
    viewselected = strong;selection

[diffviewer]
    added = dark;green
    changedline = fg;selection
    changednew = yellow;selection
    changed = cyan;bgalt
    removed = red;bg
    error = strong;redbg;bold

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ←
    history-next-item-char = →
    history-show-list-char = ↓
    filename-scroll-left-char = «
    filename-scroll-right-char = »

[widget-scrollbar]
    first-vert-char = ↑
    last-vert-char = ↓
    first-horiz-char = «
    last-horiz-char = »
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
