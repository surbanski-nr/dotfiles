---
name: Build Nvim2 offline release

'on':
  push:
    tags:
      - 'nvim2-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing nvim2 release tag
        required: true
        type: string
      force:
        description: Rebuild and replace every platform asset
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: >-
    nvim2-release-${{
      github.event_name == 'workflow_dispatch' && inputs.release_tag ||
      github.ref_name
    }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Find release and missing assets
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      force: ${{ steps.release.outputs.force }}
      platforms: ${{ steps.release.outputs.platforms }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ $EVENT_NAME == workflow_dispatch ]]; then
            release_tag=$INPUT_RELEASE_TAG
            force=${INPUT_FORCE:-false}
          else
            release_tag=$TAG_NAME
            force=false
          fi

          [[ $release_tag =~ ^nvim2-[0-9a-f]{40}$ ]] || {
            printf 'Invalid release tag: %s\n' "$release_tag" >&2
            exit 1
          }

          release_file=$RUNNER_TEMP/release.json
          error_file=$RUNNER_TEMP/release-error.txt
          attempts=1
          [[ $EVENT_NAME == push ]] && attempts=6
          release_found=false
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            if timeout 30s gh api \
              "repos/$REPOSITORY/releases/tags/$release_tag" \
              >"$release_file" 2>"$error_file"; then
              release_found=true
              break
            fi
            if ! grep -q 'HTTP 404' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
            if ((attempt < attempts)); then
              sleep 10
            fi
          done

          if [[ $release_found != true ]]; then
            printf 'Release %s does not exist; skipping build.\n' "$release_tag"
            printf '%s\n' \
              "release_tag=$release_tag" \
              "force=$force" \
              'platforms=[]' \
              'should_build=false' \
              >>"$GITHUB_OUTPUT"
            exit 0
          fi

          object_file=$RUNNER_TEMP/tag-object.json
          timeout 30s gh api \
            "repos/$REPOSITORY/git/ref/tags/$release_tag" \
            >"$object_file"
          object_type=$(jq -r '.object.type' "$object_file")
          commit_sha=$(jq -r '.object.sha' "$object_file")
          while [[ $object_type == tag ]]; do
            timeout 30s gh api \
              "repos/$REPOSITORY/git/tags/$commit_sha" \
              >"$object_file"
            object_type=$(jq -r '.object.type' "$object_file")
            commit_sha=$(jq -r '.object.sha' "$object_file")
          done
          [[ $object_type == commit ]] || {
            printf 'Tag %s does not resolve to a commit.\n' \
              "$release_tag" >&2
            exit 1
          }
          [[ ${release_tag#nvim2-} == "$commit_sha" ]] || {
            printf 'Tag suffix does not match target commit %s.\n' \
              "$commit_sha" >&2
            exit 1
          }

          platforms=(
            ubuntu-24.04-x86_64
            ubuntu-26.04-x86_64
            amzn-2023-x86_64
          )
          selected=()
          for platform in "${platforms[@]}"; do
            asset="nvim2-offline-$platform.tar.gz"
            if [[ $force == true ]] ||
              ! jq -e --arg asset "$asset" \
                '.assets[]? | select(.name == $asset)' \
                "$release_file" >/dev/null; then
              selected+=("$platform")
            fi
          done
          matrix=$(
            printf '%s\n' "${selected[@]}" |
              jq -Rsc 'split("\n") | map(select(length > 0))'
          )
          should_build=false
          ((${#selected[@]} > 0)) && should_build=true

          printf '%s\n' \
            "release_tag=$release_tag" \
            "commit_sha=$commit_sha" \
            "force=$force" \
            "platforms=$matrix" \
            "should_build=$should_build" \
            >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.preflight.outputs.platforms) }}
    steps:
      - name: Check out release commit
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - name: Select builder image
        id: image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          source .github/nvim2-release.env
          case "$PLATFORM" in
            ubuntu-24.04-x86_64) image=$UBUNTU_2404_IMAGE ;;
            ubuntu-26.04-x86_64) image=$UBUNTU_2604_IMAGE ;;
            amzn-2023-x86_64) image=$AMZN_2023_IMAGE ;;
            *) printf 'Unsupported platform: %s\n' "$PLATFORM" >&2; exit 1 ;;
          esac
          printf 'image=%s\n' "$image" >>"$GITHUB_OUTPUT"

      - name: Build platform release
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          output=$RUNNER_TEMP/nvim2-output
          mkdir -p "$output"
          timeout 300s docker pull "${{ steps.image.outputs.image }}"
          timeout --signal=TERM --kill-after=30s 3600s docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$output:/out" \
            --env RELEASE_TAG="$RELEASE_TAG" \
            --env SOURCE_COMMIT="$COMMIT_SHA" \
            --env BUILDER_IMAGE="${{ steps.image.outputs.image }}" \
            "${{ steps.image.outputs.image }}" \
            bash /workspace/scripts/nvim2-release \
              build "$PLATFORM" /workspace /out

      - name: Verify without network
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          source .github/nvim2-release.env
          runtime_container="nvim2-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PLATFORM"
          runtime_image="nvim2-runtime:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PLATFORM"
          cleanup() {
            docker rm --force "$runtime_container" >/dev/null 2>&1 || true
            docker image rm "$runtime_image" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$runtime_container" \
            "${{ steps.image.outputs.image }}" sleep infinity
          docker cp scripts/nvim2-release \
            "$runtime_container:/usr/local/bin/nvim2-release"
          timeout --signal=TERM --kill-after=15s 600s docker exec \
            --env TARGET_HOME="$TARGET_HOME" \
            --env TARGET_UID="$TARGET_UID" \
            --env TARGET_USER="$TARGET_USER" \
            "$runtime_container" \
            bash /usr/local/bin/nvim2-release \
              prepare-runtime "$PLATFORM"
          timeout 300s docker commit "$runtime_container" "$runtime_image"
          docker rm --force "$runtime_container"

          timeout --signal=TERM --kill-after=30s 900s docker run --rm \
            --network none \
            --volume "$RUNNER_TEMP/nvim2-output/$PLATFORM:/artifact:ro" \
            "$runtime_image" \
            bash /usr/local/bin/nvim2-release verify "$PLATFORM" /artifact

      - name: Create release asset
        id: asset
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/nvim2-output/$PLATFORM"
          archive="$RUNNER_TEMP/nvim2-offline-$PLATFORM.tar.gz"
          timeout 600s tar -C "$artifact" -czf "$archive" .
          size=$(stat --format=%s "$archive")
          ((size < 2147483648)) || {
            printf '%s\n' \
              "Release asset is $size bytes; GitHub limit is below 2 GiB." \
              >&2
            exit 1
          }
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          printf 'archive=%s\n' "$archive" >>"$GITHUB_OUTPUT"
          {
            printf '### %s\n\n' "$PLATFORM"
            printf -- '- Size: %s bytes\n' "$size"
            printf -- '- SHA-256: %s\n' "$digest"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload release asset
        env:
          FORCE: ${{ needs.preflight.outputs.force }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          options=()
          [[ $FORCE == true ]] && options+=(--clobber)
          timeout 300s gh release upload \
            --repo "$REPOSITORY" \
            "$RELEASE_TAG" \
            "${{ steps.asset.outputs.archive }}" \
            "${options[@]}"
