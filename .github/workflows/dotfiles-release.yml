---
name: Build dotfiles offline release

'on':
  push:
    tags:
      - 'dotfiles-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing dotfiles release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    dotfiles-release-${{
      github.event_name == 'workflow_dispatch' && inputs.release_tag ||
      github.ref_name
    }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Find release and incomplete assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      platforms: ${{ steps.release.outputs.platforms }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_run: ${{ steps.release.outputs.should_run }}
    steps:
      - name: Check out workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: ci

      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: bash ci/scripts/dotfiles-release-ci preflight

  build:
    name: Build or complete ${{ matrix.platform }}
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write  # Required to upload release assets.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.platforms) }}
    env:
      COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
      PLATFORM: ${{ matrix.platform }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - name: Check out workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: ci

      - name: Check out release commit
        if: matrix.build_archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.commit_sha }}
          path: release-source

      - name: Build archive and verify offline installation
        if: matrix.build_archive
        run: >-
          bash ci/scripts/dotfiles-release-ci build
          "$GITHUB_WORKSPACE/release-source" "$RUNNER_TEMP/dotfiles-output"

      - name: Publish archive, checksum and standalone manager
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          bash ci/scripts/dotfiles-release-ci publish
          "$RUNNER_TEMP/dotfiles-output"

      - name: Preserve qualification evidence
        if: ${{ !cancelled() && matrix.build_archive }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dotfiles-qualification-${{ matrix.platform }}
          path: ${{ runner.temp }}/dotfiles-evidence/${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 30
