---
name: Validate

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap pinned Task
        run: bash scripts/install-validation-tool task

      - name: Validate with Task-managed tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: .bin/task --output=group validate
