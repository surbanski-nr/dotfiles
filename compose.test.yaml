---
name: dotfiles-test

services:
  dev:
    image: dotfiles:local
    build: .
    group_add:
      - "${DOTFILES_DOCKER_GID:-0}"
    init: true
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      DOTFILES_UID: ${DOTFILES_UID:-1001}
      DOTFILES_GID: ${DOTFILES_GID:-1001}
      DOTFILES_DOCKER_GID: ${DOTFILES_DOCKER_GID:-0}
      DOCKER_HOST: unix:///var/run/docker.sock
      TERM: xterm-256color
      COLORTERM: ${COLORTERM:-truecolor}
    volumes:
      - type: bind
        source: ${DOTFILES_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
