---
version: '3'

env:
  VALIDATION_TOOLS_DIR: '{{.ROOT_DIR}}/bin'

vars:
  DEV_CPUS: '1'
  DEV_MEMORY: 16GiB
  DEV_DISK: 80GiB
  DEV_PROJECT: default
  DEV_NETWORK: lxdbr0
  DEV_STORAGE: default
  PLATFORMS:
    map:
      debian13:
        platform: debian-13-x86_64
        image: images:debian/13/cloud
      ubuntu2404:
        platform: ubuntu-24.04-x86_64
        image: ubuntu:24.04
      ubuntu2604:
        platform: ubuntu-26.04-x86_64
        image: ubuntu:26.04
      amazonlinux2023:
        platform: amzn-2023-x86_64
        image: "https://cdn.amazonlinux.com/al2023/os-images/2023.12.20261026.1/kvm/\
          al2023-kvm-2023.12.20261026.1-kernel-6.1-x86_64.xfs.gpt.qcow2"
        sha256: 547b7e403b5b78aad57cdaf4c4adcb6815534fa50ce7ae43e2c14dc36d8b759f

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - '"{{.TASK_EXE}}" --list'

  dev:
    desc: Open a persistent development VM (default debian13)
    summary: |
      Create or reuse one LXD VM per checkout and platform, then open a shell.
      Mount this development checkout writable, with private guest bin/HOME.
      No host SSH keys, HOME or Docker socket are shared. Run setup-* in the VM.
      Exiting a shell leaves the VM running; another invocation opens a new shell.

      Platforms: debian13, ubuntu2404, ubuntu2604, amazonlinux2023.
      Example: task dev DEV_MEMORY=8GiB -- ubuntu2404
    dir: '{{.ROOT_DIR}}'
    env:
      PLATFORM_ALIAS: '{{.CLI_ARGS | default "debian13"}}'
      PLATFORMS_JSON: '{{.PLATFORMS | toJson}}'
      DEV_CPUS: '{{.DEV_CPUS}}'
      DEV_MEMORY: '{{.DEV_MEMORY}}'
      DEV_DISK: '{{.DEV_DISK}}'
      DEV_PROJECT: '{{.DEV_PROJECT}}'
      DEV_NETWORK: '{{.DEV_NETWORK}}'
      DEV_STORAGE: '{{.DEV_STORAGE}}'
    cmds:
      - bash scripts/dev-vm

  validate:
    desc: Run all validation tasks in parallel
    deps:
      - validate:bash
      - validate:configs
      - validate:nvim2
      - validate:scripts
      - validate:tmux
      - validate:tools
      - validate:workflows

  validate:bash:
    desc: Lint Bash and Markdown, test shell logic and real terminal interaction
    deps: [tools:python, tools:shellcheck]
    cmds:
      - bash scripts/validate bash

  validate:configs:
    desc: Check YAML, JSON and Git syntax and trailing whitespace in current files
    deps: [tools:yamllint]
    cmds:
      - bash scripts/validate configs

  validate:nvim2:
    desc: Check Nvim2 Lua formatting, shell test scripts and lockfiles
    deps: [tools:shellcheck, tools:stylua]
    cmds:
      - bash scripts/validate nvim2

  validate:scripts:
    desc: Check executable bits, lint scripts and test installers, validation and offline releases
    deps: [tools:actionlint, tools:shellcheck, tools:task, tools:yamllint]
    cmds:
      - bash scripts/validate scripts

  validate:tmux:
    desc: Check tmux configuration and test reload, pane directories and the eye timer
    deps: [tools:python, tools:shellcheck]
    cmds:
      - bash scripts/validate tmux

  validate:tools:
    desc: Check tool definitions in tools.env and validation.env
    cmds:
      - bash scripts/validate tools

  validate:workflows:
    desc: Check GitHub Actions syntax and security
    deps:
      - tools:actionlint
      - tools:shellcheck
      - tools:yamllint
      - tools:zizmor
    cmds:
      - bash scripts/validate workflows

  update:python-locks:
    desc: Regenerate Python-backed Mason locks in the Nvim2 profile
    cmds:
      - bash scripts/update-offline-python-locks

  test:
    desc: Build and qualify offline packages in Docker (default all platforms)
    summary: |
      Build all platforms, then verify archives, install and run
      full functional checks offline for each successful build.
      Parallel workers are limited to the available CPU count.
      Failures do not stop other platforms; logs and artifacts are retained.

      Run in a development VM to use its Docker instead of the host daemon.
      The checkout must be clean and committed; Git operations stay on the host.

      Platforms: debian13, ubuntu2404, ubuntu2604, amazonlinux2023.
      Example: task test -- ubuntu2404
    dir: '{{.ROOT_DIR}}'
    env:
      PLATFORM_ALIAS: '{{.CLI_ARGS}}'
      PLATFORMS_JSON: '{{.PLATFORMS | toJson}}'
    cmds:
      - |
        set -eu
        platform=
        if [ -n "$PLATFORM_ALIAS" ]; then
          platform=$(printf '%s\n' "$PLATFORMS_JSON" |
            jq -er --arg alias "$PLATFORM_ALIAS" '.[$alias].platform') || {
            printf 'Unknown platform: %s\n' "$PLATFORM_ALIAS" >&2
            exit 1
          }
        fi
        bash scripts/dotfiles-release-ci test "$PWD" "$platform"

  tools:actionlint:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool actionlint

  tools:shellcheck:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool shellcheck

  tools:stylua:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool stylua

  tools:task:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool task

  tools:yamllint:
    internal: true
    run: once
    deps: [tools:python]
    cmds:
      - bash scripts/install-validation-tool yamllint

  tools:python:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool python

  tools:zizmor:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool zizmor
