---
version: '3'

env:
  VALIDATION_TOOLS_DIR: '{{.ROOT_DIR}}/bin'

tasks:
  default:
    desc: Run all validation tasks in parallel
    cmds:
      - task: validate

  validate:
    desc: Run all validation tasks in parallel
    deps:
      - validate:bash
      - validate:configs
      - validate:nvim2
      - validate:scripts
      - validate:tmux
      - validate:tools
      - validate:workflows

  validate:bash:
    desc: Lint Bash and Markdown, test shell logic and real terminal interaction
    deps: [tools:python, tools:shellcheck]
    cmds:
      - bash scripts/validate bash

  validate:configs:
    desc: Check YAML, JSON and Git syntax and trailing whitespace in current files
    deps: [tools:yamllint]
    cmds:
      - bash scripts/validate configs

  validate:nvim2:
    desc: Check Nvim2 Lua formatting, shell test scripts and lockfiles
    deps: [tools:shellcheck, tools:stylua]
    cmds:
      - bash scripts/validate nvim2

  validate:scripts:
    desc: Check executable bits, lint scripts and test installers, validation and offline releases
    deps: [tools:actionlint, tools:shellcheck, tools:yamllint]
    cmds:
      - bash scripts/validate scripts

  validate:tmux:
    desc: Check tmux configuration and test config reload and the eye timer
    deps: [tools:python, tools:shellcheck]
    cmds:
      - bash scripts/validate tmux

  validate:tools:
    desc: Check tool definitions in tools.env and validation.env
    cmds:
      - bash scripts/validate tools

  validate:workflows:
    desc: Check GitHub Actions syntax and security
    deps:
      - tools:actionlint
      - tools:shellcheck
      - tools:yamllint
      - tools:zizmor
    cmds:
      - bash scripts/validate workflows

  update:python-locks:
    desc: Regenerate Python-backed Mason locks in the Nvim2 profile
    cmds:
      - bash scripts/update-offline-python-locks

  test:offline:
    desc: Build and qualify offline packages in parallel (optional PLATFORM)
    summary: |
      Build all platforms in parallel, then verify archives, install and run
      full functional checks offline for each successful build.
      Failures do not stop other platforms; logs and artifacts are retained.

      Optional PLATFORM (default: all):
        debian-13-x86_64
        ubuntu-24.04-x86_64
        ubuntu-26.04-x86_64
        amzn-2023-x86_64

      Example: task test:offline PLATFORM=ubuntu-24.04-x86_64
    dir: '{{.ROOT_DIR}}'
    env:
      PLATFORM: '{{.PLATFORM | default ""}}'
    cmds:
      - bash scripts/dotfiles-release-ci test "{{.ROOT_DIR}}" "$PLATFORM"

  tools:actionlint:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool actionlint

  tools:shellcheck:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool shellcheck

  tools:stylua:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool stylua

  tools:yamllint:
    internal: true
    run: once
    deps: [tools:python]
    cmds:
      - bash scripts/install-validation-tool yamllint

  tools:python:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool python

  tools:zizmor:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool zizmor
