---
version: '3'

env:
  VALIDATION_TOOLS_DIR: '{{.ROOT_DIR}}/bin'

vars:
  DEV_CPUS: '1'
  DEV_MEMORY: 16GiB
  DEV_DISK: 80GiB
  DEV_PROJECT: default
  DEV_NETWORK: lxdbr0
  DEV_STORAGE: default

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - '"{{.TASK_EXE}}" --list'

  map:
    desc: Generate an offline interactive map of shell scripts, functions and env readers
    dir: '{{.ROOT_DIR}}'
    deps: [tools:python, tools:shfmt]
    cmds:
      - '"{{.ROOT_DIR}}/bin/python/bin/python3" maintenance/shell_map.py --shfmt "{{.ROOT_DIR}}/bin/shfmt"'

  dev:
    desc: Open a persistent development VM
    summary: |
      Create or reuse one LXD VM per checkout and platform, then open a shell.
      Mount this development checkout writable, with private guest bin/HOME.
      No host SSH keys, HOME or Docker socket are shared. Run setup-* in the VM.
      Exiting a shell leaves the VM running; another invocation opens a new shell.

      Platform aliases and the default VM are configured in platforms.env.
      Example: task dev DEV_MEMORY=8GiB -- ubuntu2404
    dir: '{{.ROOT_DIR}}'
    env:
      PLATFORM_ALIAS: '{{.CLI_ARGS}}'
      DEV_CPUS: '{{.DEV_CPUS}}'
      DEV_MEMORY: '{{.DEV_MEMORY}}'
      DEV_DISK: '{{.DEV_DISK}}'
      DEV_PROJECT: '{{.DEV_PROJECT}}'
      DEV_NETWORK: '{{.DEV_NETWORK}}'
      DEV_STORAGE: '{{.DEV_STORAGE}}'
    cmds:
      - bash scripts/dev-vm

  k9s:
    desc: Preview k9s using a reusable kind cluster
    summary: |
      Run in an environment with Docker, kind, kubectl and k9s installed.
      Create or reuse this checkout's cluster, deploy preview workloads and open k9s.
      Repository configuration is linked into a private writable preview profile.
      Exiting k9s leaves the cluster running. Use task k9s:clean to remove it.
    dir: '{{.ROOT_DIR}}'
    interactive: true
    cmds:
      - bash scripts/k9s-preview

  k9s:clean:
    desc: Remove this checkout's k9s preview cluster and private files
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bash scripts/k9s-preview clean

  devcontainer:
    desc: Build and open a persistent development container
    dir: '{{.ROOT_DIR}}'
    interactive: true
    cmds:
      - task: devcontainer:up
      - docker compose --file compose.yaml exec dev bash --login

  devcontainer:build:
    desc: Build the independent Debian development image
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        docker compose \
          --file compose.yaml \
          build \
          --no-cache \
          --build-arg DEV_UID="$(id -u)" \
          --build-arg DEV_GID="$(id -g)"

  update:mise-locks:
    desc: Regenerate mise.lock with the image's pinned mise
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        docker build \
          --target mise \
          --tag dotfiles:mise \
          .
      - |
        docker run \
          --rm \
          --user "${DOTFILES_UID:-$(id -u)}:${DOTFILES_GID:-$(id -g)}" \
          --env MISE_GLOBAL_CONFIG_FILE=/config/mise.toml \
          --env MISE_DATA_DIR=/tmp/mise \
          --env MISE_CACHE_DIR=/tmp/mise/cache \
          --env MISE_STATE_DIR=/tmp/mise/state \
          --workdir /config \
          --mount "type=bind,source=$PWD,target=/config" \
          dotfiles:mise \
          mise lock \
            --global \
            --platform linux-x64

  devcontainer:up:
    desc: Build without cache and start the development container
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: devcontainer:build
      - docker compose --file compose.yaml up -d --no-build

  devcontainer:clean:
    desc: Remove the development container and retain its HOME volume
    dir: '{{.ROOT_DIR}}'
    cmds:
      - docker compose --file compose.yaml down

  validate:
    desc: Run all validation tasks in parallel
    deps:
      - validate:bash
      - validate:configs
      - validate:nvim2
      - validate:scripts
      - validate:tmux
      - validate:tools
      - validate:workflows

  validate:bash:
    desc: Lint Bash and Markdown, test shell logic and real terminal interaction
    deps: [tools:python, tools:shellcheck]
    cmds:
      - bash scripts/validate bash

  validate:configs:
    desc: Check YAML, JSON and Git syntax and trailing whitespace in current files
    deps: [tools:yamllint]
    cmds:
      - bash scripts/validate configs

  validate:nvim2:
    desc: Check Nvim2 Lua formatting, shell test scripts and lockfiles
    deps: [tools:shellcheck, tools:stylua]
    cmds:
      - bash scripts/validate nvim2

  validate:scripts:
    desc: Check executable bits, lint scripts and test installers, validation and offline releases
    deps: [tools:actionlint, tools:python, tools:shellcheck, tools:shfmt, tools:task, tools:yamllint]
    cmds:
      - bash scripts/validate scripts

  validate:tmux:
    desc: Check tmux configuration and test reload, pane directories and the eye timer
    deps: [tools:python, tools:shellcheck]
    cmds:
      - bash scripts/validate tmux

  validate:tools:
    desc: Check tool definitions in tools.env and validation.env
    cmds:
      - bash scripts/validate tools

  validate:workflows:
    desc: Check GitHub Actions syntax, security and publication
    deps:
      - tools:actionlint
      - tools:shellcheck
      - tools:yamllint
      - tools:zizmor
    cmds:
      - bash scripts/validate workflows

  update:python-locks:
    desc: Regenerate Python-backed Mason locks for Nvim2
    cmds:
      - bash scripts/update-offline-python-locks

  test:
    desc: Qualify offline packages and the development image
    summary: |
      Run offline qualification, then build and test a separate development image.
      The offline default is all platforms; a CLI alias selects one platform.
      The image test uses a disposable container and always cleans it up.
      The persistent development container stays running.

      Example: task test -- ubuntu2404
    cmds:
      - task: test:offline
      - task: test:devcontainer

  test:offline:
    desc: Build and qualify offline packages in Docker (default all platforms)
    summary: |
      Build all platforms, then verify archives, install and run
      full functional checks offline for each successful build.
      Parallel workers are limited to the available CPU count.
      Failures do not stop other platforms; logs and artifacts are retained.

      Run in a development VM to use its Docker instead of the host daemon.
      The checkout must be clean and committed; Git operations stay on the host.

      Platform aliases and the default test list are configured in platforms.env.
      Example: task test:offline -- ubuntu2404
    dir: '{{.ROOT_DIR}}'
    env:
      PLATFORM_ALIAS: '{{.CLI_ARGS}}'
    cmds:
      - bash scripts/dotfiles-release-ci test "$PWD" "$PLATFORM_ALIAS"

  test:devcontainer:
    desc: Build, test and remove an isolated development container
    dir: '{{.ROOT_DIR}}'
    cmds:
      - defer: docker compose --file compose.test.yaml down
      - |
        docker compose \
          --file compose.test.yaml \
          build \
          --no-cache
      - docker compose --file compose.test.yaml up -d --no-build
      - |
        docker compose --file compose.test.yaml exec -T dev \
          timeout --kill-after=10s 1800s \
          bash --login -ic 'exec bash /opt/dotfiles/tests/container_tools_runner.sh'

  tools:actionlint:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool actionlint

  tools:shellcheck:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool shellcheck

  tools:shfmt:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool shfmt

  tools:stylua:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool stylua

  tools:task:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool task

  tools:yamllint:
    internal: true
    run: once
    deps: [tools:python]
    cmds:
      - bash scripts/install-validation-tool yamllint

  tools:python:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool python

  tools:zizmor:
    internal: true
    run: once
    cmds:
      - bash scripts/install-validation-tool zizmor
