# tmux-256color advertises modern tmux features such as italics, extended keys,
# and OSC 52. Use screen-256color only when a host lacks tmux-256color terminfo.
set -g default-terminal "tmux-256color"
# Tc is tmux's widely supported true-color flag for xterm-256color terminals.
set -ag terminal-overrides ",xterm-256color:Tc"

# Reload: tmux source-file ~/.tmux.conf
# New session: tmux new-session -s work
# Attach: tmux attach-session -t work
# Restart (closes sessions): tmux kill-server, then tmux new-session -s work
# Daily use below assumes the Ctrl+a prefix.
# c: new window; ,: rename window; n/p: next/previous; w: choose window.
# a: last window; Ctrl+p/Ctrl+n: previous/next (tmux-sensible).
# Shift+r: reload config (tmux-sensible); d: detach; $: rename session.
# %: split left/right; ": split top/bottom; h/j/k/l: select pane.
# Ctrl+Arrow: resize pane; z: toggle pane zoom; x: close pane.
# [: copy mode; ]: paste the tmux buffer.

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Enable pane focus and scrollback; hold Shift to select text in the terminal.
set -g mouse on

set-window-option -g mode-keys vi
# Keep this >0 to reliably parse Escape-prefixed key sequences (arrows, meta keys),
# especially over slower/variable connections.
set -s escape-time 50

# Copy tmux selections to the terminal clipboard through OSC 52. "external"
# prevents applications inside tmux from writing tmux buffers themselves.
set -g set-clipboard external

# Pane navigation that does not depend on arrow/meta escape sequences.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Copy mode: prefix [, v to select, y to copy, then prefix ] or Ctrl+Shift+V.
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

set -g status-position top
set -g status-left ""
# colour24 is dark blue and colour33 is brighter blue.
set -g status-style 'bg=colour24,fg=white'
# Match the active window to the bar; its window flag still shows `*`.
set -g window-status-current-style 'bg=colour24,fg=white'
set -g window-status-separator '   '
# Blue active border; keep yellow for copy mode and red for synchronized panes.
set -g pane-active-border-style '#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=colour33}}'
# Keep the short hostname stable instead of showing the active pane's title.
set -g status-right '#h %H:%M %d-%b-%y'
set -g status on
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# prefix I - install
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# set -g @themepack 'powerline/default/cyan'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM when installed; plain tmux remains usable without it.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
