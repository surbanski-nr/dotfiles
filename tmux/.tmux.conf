# tmux-256color advertises modern tmux features such as italics, extended keys,
# and OSC 52. Use screen-256color only when a host lacks tmux-256color terminfo.
set -g default-terminal "tmux-256color"
# Tc is tmux's widely supported true-color flag for xterm-256color terminals.
set -ag terminal-overrides ",xterm-256color:Tc"

# Shell quick reference:
# tmux new-session -s work: create the named session; tmux attach -t work: attach.
# tmux list-sessions: list sessions; tmux kill-session -t work: close one session.
# tmux source-file ~/.tmux.conf: reload; tmux kill-server: close every session.
# Key reference below assumes the Ctrl+a prefix:
# c: new window; ,: rename it; n/p: next/previous; a: previously active; w: choose.
# Ctrl+n/Ctrl+p: next/previous window; Shift+r: reload config (tmux-sensible).
# %: split left/right; ": split top/bottom; h/j/k/l: focus a pane; q: show numbers.
# Ctrl+Arrow: resize pane; Space: cycle layouts; z: zoom; x: close; d: detach.
# $: rename session; :: command prompt; Ctrl+a: send the prefix through tmux.
# [: copy mode; v: start selection; y: copy and leave; ]: paste tmux's buffer.
# In copy mode use arrows, h/j/k/l, PageUp/PageDown; mouse wheel scrolls history.
# Hold Shift and drag for terminal selection; Ctrl+Shift+C/V copies/pastes locally.
# Shift+I: install TPM plugins; Shift+U: update; Alt+u: remove unused plugins.

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Enable pane focus and scrollback; hold Shift to select text in the terminal.
set -g mouse on

set-window-option -g mode-keys vi
# Keep this >0 to reliably parse Escape-prefixed key sequences (arrows, meta keys),
# especially over slower/variable connections.
set -s escape-time 50

# Let tmux copy mode and trusted applications such as Neovim copy to the local
# terminal through OSC 52. This does not enable automatic copy-on-selection.
set -g set-clipboard on

# Pane navigation that does not depend on arrow/meta escape sequences.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Copy mode: prefix [, v to select, y to copy, then prefix ] or Ctrl+Shift+V.
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

set -g status-position top
set -g status-left ""
# colour24 is dark blue and colour33 is brighter blue.
set -g status-style 'bg=colour24,fg=white'
# Match the active window to the bar; its window flag still shows `*`.
set -g window-status-current-style 'bg=colour24,fg=white'
set -g window-status-separator '   '
# Blue active border; keep yellow for copy mode and red for synchronized panes.
set -g pane-active-border-style '#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=colour24}}'
# Keep time, date and the default-route IPv4 at every width. At 160+ columns,
# show IP then the full short hostname. At 120-159, keep IP first and trim the
# hostname to 15 characters plus an ellipsis. Below 120, remove the hostname
# before the IP. This leaves progressively more space for the window list.
# Do not use hostname -i: minimal Amazon Linux 2 lacks it, and hostname lookup
# can return loopback or multiple unrelated addresses instead of the route IP.
# status-right-length is a maximum, not reserved space.
set -g status-right-length 80
set -g status-right '#{?#{e|>=:#{client_width},160},#(ip -4 route get 1.1.1.1 2>/dev/null | grep -o "src [^ ]*" | cut -d " " -f2) #h %H:%M %d-%b-%y,#{?#{e|>=:#{client_width},120},#(ip -4 route get 1.1.1.1 2>/dev/null | grep -o "src [^ ]*" | cut -d " " -f2) #{=/15/…:host_short} %H:%M %d-%b-%y,#(ip -4 route get 1.1.1.1 2>/dev/null | grep -o "src [^ ]*" | cut -d " " -f2) %H:%M %d-%b-%y}}'
set -g status on
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# prefix I - install
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# set -g @themepack 'powerline/default/cyan'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM when installed; plain tmux remains usable without it.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
