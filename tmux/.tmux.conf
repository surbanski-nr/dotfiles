# Tell programs inside tmux to use tmux's 256-color terminfo capabilities.
set -g default-terminal "tmux-256color"
# For outer terminals reporting xterm-256color, append RGB to enable true color.
set -ag terminal-overrides ",xterm-256color:RGB"

# Reload: tmux source-file ~/.tmux.conf
# New session: tmux new-session -s work
# Attach: tmux attach-session -t work
# Restart (closes sessions): tmux kill-server, then tmux new-session -s work

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Let the terminal handle mouse selection and Ctrl+Shift+C/V without tmux capture.
set -g mouse off

set-window-option -g mode-keys vi
# Keep this >0 to reliably parse Escape-prefixed key sequences (arrows, meta keys),
# especially over slower/variable connections.
set -s escape-time 50

# Let the terminal own selection, copy, and paste handling.
set -g set-clipboard off

# Pane navigation that does not depend on arrow/meta escape sequences.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

set -g status-position top
set -g status-left ""
# Keep the short hostname stable instead of showing the active pane's title.
set -g status-right '#h %H:%M %d-%b-%y'
set -g status on
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# prefix I - install
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# set -g @themepack 'powerline/default/cyan'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
