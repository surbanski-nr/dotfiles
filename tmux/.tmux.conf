# tmux-256color advertises modern tmux features such as italics, extended keys,
# and OSC 52. Use screen-256color only when a host lacks tmux-256color terminfo.
set -g default-terminal "tmux-256color"
# Tc is tmux's widely supported true-color flag for xterm-256color terminals.
set -ag terminal-overrides ",xterm-256color:Tc"

# Shell quick reference:
# tmux new-session -s work: create the named session; tmux attach -t work: attach.
# tmux list-sessions: list sessions; tmux kill-session -t work: close one session.
# tmux source-file ~/.tmux.conf: reload; tmux kill-server: close every session.
# Key reference below assumes the Ctrl+a prefix:
# c: new window; ,: rename it; n/p: next/previous; a: previously active; w: choose.
# Ctrl+n/Ctrl+p: next/previous window; Shift+r: reload this server's config.
# %: split left/right; ": split top/bottom; h/j/k/l: focus a pane; q: show numbers.
# Ctrl+Arrow: resize pane; Space: cycle layouts; z: zoom; x: close; d: detach.
# $: rename session; :: command prompt; Ctrl+a: send the prefix through tmux.
# [: copy mode; v: start selection; y: copy and leave; ]: paste tmux's buffer.
# In copy mode use arrows, h/j/k/l, PageUp/PageDown; mouse wheel scrolls history.
# Hold Shift and drag for terminal selection; Ctrl+Shift+C/V copies/pastes locally.
# Shift+I: install TPM plugins; Shift+U: update; Alt+u: remove unused plugins.

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Enable pane focus and scrollback; hold Shift to select text in the terminal.
set -g mouse on

set-window-option -g mode-keys vi
# Keep this >0 to reliably parse Escape-prefixed key sequences (arrows, meta keys),
# especially over slower/variable connections.
set -s escape-time 50

# Let tmux copy mode and trusted applications such as Neovim copy to the local
# terminal through OSC 52. This does not enable automatic copy-on-selection.
set -g set-clipboard on

# Pane navigation that does not depend on arrow/meta escape sequences.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Copy mode: prefix [, v to select, y to copy, then prefix ] or Ctrl+Shift+V.
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

set -g status-position top
set -g status-left ""

# Theme A (active): use the terminal background with a brighter blue border.
set -g status-style 'bg=default,fg=white'
set -g window-status-current-style 'bg=default,fg=white'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style '#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=colour33}}'

# Theme B (alternative): teal status bar and active border. To use it, comment
# the four Theme A lines above and uncomment the four lines below.
# set -g status-style 'bg=#008080,fg=white'
# set -g window-status-current-style 'bg=#008080,fg=white'
# set -g pane-border-style 'fg=colour238'
# set -g pane-active-border-style '#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=#008080}}'

set -g window-status-separator '   '
# Keep the default-route IPv4 and the time/date groups separated by `|`.
# Add the hostname to the IP group only at 160+ columns.
# Do not use hostname -i: minimal Amazon Linux 2 lacks it, and hostname lookup
# can return loopback or multiple unrelated addresses instead of the route IP.
# status-right-length is a maximum, not reserved space.
set -g status-right-length 80
set -g status-right '#(ip -4 route get 1.1.1.1 2>/dev/null | grep -o "src [^ ]*" | cut -d " " -f2)#{?#{e|>=:#{client_width},160}, #h,} | %H:%M %d-%b-%y'
set -g status on
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# The release launcher supplies physical paths, so a running server never
# follows `current` after an upgrade. Connected setup keeps its TPM loader.
if-shell '[ -n "${TMUX_OFFLINE_RELEASE_ROOT:-}" ]' \
  'set -g @dotfiles-config "$TMUX_OFFLINE_CONFIG"; run-shell "$TMUX_OFFLINE_RELEASE_ROOT/share/tmux/plugins/tmux-sensible/sensible.tmux"; run-shell "$TMUX_OFFLINE_RELEASE_ROOT/share/tmux/plugins/tmux-resurrect/resurrect.tmux"; run-shell "$TMUX_OFFLINE_RELEASE_ROOT/share/tmux/plugins/tmux-continuum/continuum.tmux"' \
  'set -g @plugin "tmux-plugins/tpm"; set -ag @plugin " tmux-plugins/tmux-sensible"; set -ag @plugin " tmux-plugins/tmux-resurrect"; set -ag @plugin " tmux-plugins/tmux-continuum"; run-shell "${TMUX_PLUGIN_MANAGER_PATH:-$HOME/.tmux/plugins/tpm}/tpm"'

bind-key R source-file '#{@dotfiles-config}' \; display-message 'Reloaded #{@dotfiles-config}'
