plugins:
  # See https://k9scli.io/topics/plugins/
  # The log commands deliberately omit --tail to include all retained history.
  raw-logs-follow:
    shortCut: Ctrl-L
    description: logs -f
    scopes:
      - po
    command: kubectl
    background: false
    args:
      - logs
      - --all-containers=true
      - --prefix=true
      - -f
      - $NAME
      - -n
      - $NAMESPACE
      - --context
      - $CONTEXT
      - --kubeconfig
      - $KUBECONFIG
  log-less:
    shortCut: Shift-L
    description: "logs|less"
    scopes:
      - po
    command: bash
    background: false
    args:
      - -c
      - '"$@" | less'
      - dummy-arg
      - kubectl
      - logs
      - --all-containers=true
      - --prefix=true
      - $NAME
      - -n
      - $NAMESPACE
      - --context
      - $CONTEXT
      - --kubeconfig
      - $KUBECONFIG
  watch-events:
    shortCut: Shift-E
    description: watch events
    scopes:
      - all
    command: bash
    background: false
    args:
      - -c
      - |
        set -eu
        namespace=$1
        resource=$2
        group=$3
        name=$4
        context=$5
        kubeconfig=$6

        if [[ -n $group ]]; then
          resource="$resource.$group"
        fi

        command=(kubectl events --context "$context" --kubeconfig "$kubeconfig")
        case $namespace in
          '' | - | '*' | all) command+=(--all-namespaces) ;;
          *) command+=(--namespace "$namespace") ;;
        esac
        exec "${command[@]}" --for "$resource/$name" --watch
      - dummy-arg
      - $NAMESPACE
      - $RESOURCE_NAME
      - $RESOURCE_GROUP
      - $NAME
      - $CONTEXT
      - $KUBECONFIG
