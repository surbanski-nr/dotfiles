# -----------------------------------------------------------------------------
# Surb skin
# -----------------------------------------------------------------------------

# Styles...
fg: &fg "white"
bg: &bg "default"
mark: &mark "darkgoldenrod"
active: &active "dimgray"
text: &text "navajowhite"
white: &white "whitesmoke"
ghost: &ghost "ghostwhite"
err: &err "pink"
slate: &slate "slategray"
gray: &gray "gray"
muted: &muted "#909090"

# Skin...
k9s:
  body:
    fgColor: *fg
    bgColor: *bg
    logoColor: *fg
  prompt:
    fgColor: *fg
    bgColor: *bg
    suggestColor: *gray
  help:
    fgColor: *fg
    bgColor: *bg
    sectionColor: *white
    keyColor: *fg
    numKeyColor: *text
  info:
    fgColor: *text
    sectionColor: *fg
  dialog:
    fgColor: *fg
    bgColor: *bg
    buttonFgColor: *fg
    buttonBgColor: *bg
    buttonFocusFgColor: *slate
    buttonFocusBgColor: *white
    labelFgColor: *ghost
    fieldFgColor: *white
  frame:
    border:
      fgColor: *fg
      focusColor: *fg
    menu:
      fgColor: *fg
      keyColor: *fg
      numKeyColor: *text
    crumbs:
      fgColor: *fg
      bgColor: *bg
      activeColor: *active
    status:
      newColor: *white
      modifyColor: *text
      addColor: *ghost
      errorColor: *err
      highlightColor: *text
      killColor: *slate
      completedColor: *muted
    title:
      fgColor: *fg
      bgColor: *bg
      highlightColor: *muted
      counterColor: *text
      filterColor: *slate
  views:
    table:
      fgColor: *fg
      bgColor: *bg
      cursorBgColor: *fg
      cursorFgColor: "black"
      markColor: *mark
      header:
        fgColor: *white
        bgColor: *bg
        sorterColor: *fg
    xray:
      fgColor: *fg
      bgColor: *bg
      cursorColor: *ghost
      graphicColor: *gray
      showIcons: false
    yaml:
      keyColor: *ghost
      colonColor: *slate
      valueColor: *text
    logs:
      fgColor: *ghost
      bgColor: *bg
      indicator:
        fgColor: *ghost
        bgColor: *bg
        toggleOnColor: *mark
        toggleOffColor: *gray
    charts:
      bgColor: *bg
      dialBgColor: *bg
      chartBgColor: *bg
      defaultDialColors:
        - *white
        - *err
      defaultChartColors:
        - *white
        - *err
