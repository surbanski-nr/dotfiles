# -----------------------------------------------------------------------------
# Surb skin
# -----------------------------------------------------------------------------

# Default text follows the terminal; light accents use a neutral white.
fg: &fg "default"
bg: &bg "default"
mark: &mark "darkgoldenrod"
active: &active "#909dab"
text: &text "navajowhite"
white: &white "#d0d0d0"
ghost: &ghost "default"
err: &err "#f47067"
slate: &slate "#909dab"
gray: &gray "#909dab"
muted: &muted "#909dab"

# Skin...
k9s:
  body:
    fgColor: *fg
    bgColor: *bg
    logoColor: *white
  prompt:
    fgColor: *fg
    bgColor: *bg
    suggestColor: *gray
  help:
    fgColor: *fg
    bgColor: *bg
    sectionColor: *white
    keyColor: *fg
    numKeyColor: *text
  info:
    fgColor: *text
    sectionColor: *fg
  dialog:
    fgColor: *fg
    bgColor: *bg
    buttonFgColor: *fg
    buttonBgColor: *bg
    buttonFocusFgColor: "black"
    buttonFocusBgColor: *white
    labelFgColor: *ghost
    fieldFgColor: *white
  frame:
    border:
      fgColor: *fg
      focusColor: *fg
    menu:
      fgColor: *fg
      keyColor: *white
      numKeyColor: *text
    crumbs:
      fgColor: *fg
      bgColor: *bg
      activeColor: *active
    status:
      newColor: *white
      modifyColor: *text
      addColor: *white
      pendingColor: *mark
      errorColor: *err
      highlightColor: *text
      killColor: *slate
      completedColor: *muted
    title:
      fgColor: *fg
      bgColor: *bg
      highlightColor: *muted
      counterColor: *text
      filterColor: *slate
  views:
    table:
      fgColor: *fg
      bgColor: *bg
      cursorBgColor: *white
      cursorFgColor: "black"
      markColor: *mark
      header:
        fgColor: *white
        bgColor: *bg
        sorterColor: *fg
        selectedSortColumnColor: *white
    xray:
      fgColor: *fg
      bgColor: *bg
      cursorColor: *ghost
      graphicColor: *gray
      showIcons: false
    yaml:
      keyColor: *ghost
      colonColor: *slate
      valueColor: *text
    logs:
      fgColor: *ghost
      bgColor: *bg
      indicator:
        fgColor: *ghost
        bgColor: *bg
        toggleOnColor: *mark
        toggleOffColor: *gray
    charts:
      bgColor: *bg
      dialBgColor: *bg
      chartBgColor: *bg
      defaultDialColors:
        - *white
        - *err
      defaultChartColors:
        - *white
        - *err
